
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    env_file:
      - .env # ✅ LOAD ENV FILE
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY} # ✅ PASS KEY

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: axionx
      POSTGRES_PASSWORD: axionx
      POSTGRES_DB: axionx_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
